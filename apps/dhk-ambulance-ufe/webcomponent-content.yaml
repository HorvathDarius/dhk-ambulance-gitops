apiVersion: polyfea.github.io/v1alpha1
kind: WebComponent
metadata:
  name: dhk-ambulance-ufe-content
spec:
  microFrontend: dhk-ambulance-ufe
  element: vykon-app
  attributes:
    - name: base-path
      value: /dhk-ambulance-wl/
    - name: api-base
      value: http://localhost:30081/api
  displayRules:
    - allOf:
      - context-name: main-content
      - path: "^(\\.?/)?dhk-ambulance-wl(/.*)?$"